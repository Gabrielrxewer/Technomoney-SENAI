version: "3.9"
services:
  redis:
    image: redis:7-alpine
    container_name: technomoney-redis
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: technomoney-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: technomoney
      POSTGRES_PASSWORD: technopass
      POSTGRES_DB: technomoney_auth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./technomoney-auth/docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth:
    build:
      context: ./technomoney-auth
    container_name: technomoney-auth
    env_file:
      - ./technomoney-auth/.env
    environment:
      NODE_ENV: production
      PORT: "4000"
      SWAGGER_FILE: /app/dist/openapi.yaml
      ENTRY_FILE: dist/server.js
      JWT_KEYS_DIR: /app/keys
      JWT_AUTO_GENERATE_KEYS: "${JWT_AUTO_GENERATE_KEYS:-1}"
      TOTP_ENC_KEY: "${TOTP_ENC_KEY:-p9ZAq7xM4sN1vT8yR3bC6wH2kJ5fL0GdQzXeUiPoSrYtVh8L_c2BnEmWjRs9F!}"
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: technomoney
      DB_PASSWORD: technopass
      DB_DATABASE: technomoney_auth
      REDIS_URL: "redis://redis:6379/0"
      INTROSPECTION_CLIENTS: "core-service:core-secret,payments-service:payments-secret,ia-service:ia-secret"
    ports:
      - "4000:4000"
    restart: unless-stopped
    volumes:
      - ./technomoney-auth/keys:/app/keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -lc "
      node -e \"require('child_process').execSync('npx sequelize-cli db:migrate',{stdio:'inherit'})\" &&
      node \"$${ENTRY_FILE:-dist/server.js}\"
      "

  api:
    build:
      context: ./technomoney-api
    container_name: technomoney-api
    env_file:
      - ./technomoney-api/.env
    environment:
      NODE_ENV: production
      PORT: "4002"
      SWAGGER_FILE: /app/dist/openapi.yaml
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: technomoney
      DB_PASSWORD: technopass
      DB_DATABASE: technomoney_auth
      SKIP_DB_MIGRATIONS: "${SKIP_DB_MIGRATIONS:-0}"
      MARKET_API_BASE_URL: "http://host.docker.internal:4001"
      AUTH_INTROSPECTION_URL: "http://auth:4000/oauth2/introspect"
      AUTH_INTROSPECTION_CLIENT_ID: core-service
      AUTH_INTROSPECTION_CLIENT_SECRET: core-secret
    ports:
      - "4002:4002"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started

  payments:
    build:
      context: ./technomoney-payment-api
    container_name: technomoney-payments
    env_file:
      - ./technomoney-payment-api/.env
    environment:
      NODE_ENV: production
      PORT: "3001"
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: technomoney
      DB_PASSWORD: technopass
      DB_DATABASE: technomoney_auth
      AUTH_INTROSPECTION_URL: "http://auth:4000/oauth2/introspect"
      AUTH_INTROSPECTION_CLIENT_ID: payments-service
      AUTH_INTROSPECTION_CLIENT_SECRET: payments-secret
    ports:
      - "3001:3001"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started

  ia-agent:
    build:
      context: ./technomoney-ia
    container_name: technomoney-ia
    env_file:
      - ./technomoney-ia/.env
    environment:
      NODE_ENV: production
      PORT: "4010"
      AUTH_INTROSPECTION_URL: "http://auth:4000/oauth2/introspect"
      RATE_LIMIT_WINDOW_MS: "60000"
      RATE_LIMIT_MAX: "60"
      AUTH_INTROSPECTION_CLIENT_ID: ia-service
      AUTH_INTROSPECTION_CLIENT_SECRET: ia-secret
    ports:
      - "4010:4010"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      auth:
        condition: service_started

volumes:
  pgdata:
